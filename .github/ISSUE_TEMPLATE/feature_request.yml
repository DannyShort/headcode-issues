name: Suggest an idea
description: Something new for Headcode, or a way to make it better.
title: "[Idea]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please look through the [open ideas](https://github.com/DannyShort/headcode-issues/issues?q=is%3Aissue+is%3Aopen+label%3Aenhancement) first, and add a 👍 to one you'd like rather than opening another: the most wanted get looked at first.

        **This repository is public**, so please don't include anything personal.
  - type: textarea
    id: idea
    attributes:
      label: What's your idea?
      description: What would you like Headcode to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The journey or situation where you'd use it. Knowing the problem helps us find the best way to solve it.
      placeholder: When my train's cancelled I want to see the next one to the same place without searching again.
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Journeys and live running
        - Platforms, formation or connections
        - Notifications
        - Logbook and tokens
        - Map or stations
        - Account and sync
        - Something new
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, screenshots or other apps that do it well.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Filled in for you when you suggest from the app.
